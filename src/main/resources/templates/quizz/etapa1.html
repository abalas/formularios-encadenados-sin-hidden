<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>MiniQuizz etapa 1</title>
	<link rel="stylesheet" th:href="@{/estilos.css}">
</head>
<body>
	<header th:replace="~{quizz/fragmentos :: cabecera}"></header>
	<form method="post" th:action="@{${base}}">
		<p th:replace="~{quizz/fragmentos :: error}"></p>
		<p>
			<label for="nombre">Nombre:</label>
			<input type="text" id="nombre" name="nombre" th:value="${nombre}" autofocus />
		</p>
		<input type="submit" value="Siguiente" />
	</form>
	<aside th:replace="~{quizz/fragmentos :: depuracion}"></aside>
</body>
</html>
