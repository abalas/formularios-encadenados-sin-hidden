spring.application.name=formularios-encadenados
# el 8080 lo tengo ocupado por Docker
server.port=8081
# duracion de la sesion (por defecto ya son 30 min, lo pongo para que se vea)
server.servlet.session.timeout=30m
# que la sesion vaya solo por cookie y no meta ;jsessionid=... en las URLs
server.servlet.session.tracking-modes=cookie
